<!doctype html>
<html><head><meta charset="utf-8"><title>Fake Checkout</title>
<style>body{font-family:sans-serif;max-width:600px;margin:60px auto}label{display:block;margin:8px 0}input{width:100%;padding:6px}button{padding:10px 18px;font-size:16px}</style>
</head><body>
<h1>Fake Store — Checkout</h1>
<form id="f">
  <label>Address line 1 <input id="a1" name="address1" value="123 MAIN STREET"></label>
  <label>Address line 2 <input id="a2" name="address2" value="Apt 4"></label>
  <label>City <input id="city" name="city" value="Springfield"></label>
  <label>State <input name="state" value="IL"></label>
  <label>ZIP <input name="zip" value="62701"></label>
  <p><button type="submit" id="place">Place your order</button></p>
</form>
<p id="result"></p>
<script>
  // --- stub the extension API so content.js runs as a plain page script ---
  const store = { addresses: ["123 Main St, Apt #4\nSpringfield, IL 62701", "PO Box 987, Austin TX 78701"], current: "789 Oak Ave, Springfield, IL 62704", enabled: true };
  const listeners = [];
  window.chrome = { storage: {
    sync: { get: async () => ({ ...store }), set: async v => { Object.assign(store, v); listeners.forEach(l => l({}, "sync")); } },
    onChanged: { addListener: l => listeners.push(l) }
  }};
  document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); document.getElementById("result").textContent = "ORDER SUBMITTED"; });
</script>
<script src="../normalize.js"></script>
<script src="../content.js"></script>
</body></html>
